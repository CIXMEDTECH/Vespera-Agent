name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# This repository is public and the jobs run on a self-hosted runner, so pull
# requests from forks are skipped: their code must not run on that machine.
jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash -n scripts/install.sh

  musl:
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # uv, not pip or python3 -m venv: the runner's system Python has neither pip
      # access nor ensurepip, and it keeps its state between jobs.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install zig and cargo-zigbuild
        run: |
          uv venv "$RUNNER_TEMP/zig"
          uv pip install --python "$RUNNER_TEMP/zig" ziglang==0.17.0 cargo-zigbuild
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl
      - name: Binary is static and small
        run: |
          f=target/x86_64-unknown-linux-musl/release/vespera-agent
          file "$f"
          ls -l "$f"
          "$f" --version
